name: Sync quickjs-ng

# vendored 上游副本的同步 / 纯净度校验工具。
# 详见 modules/quickjs/src/main/cinterop/quickjs-ng/README.md
#
# mode=verify : 只比对不修改, 确认没人绕过流程偷改源码 (可安全随时跑)
# mode=sync   : 拉取指定 ref 覆盖源码, 然后开 PR (绝不直推默认分支)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "上游 ref (tag / 分支 / commit sha)。默认 = 当前 pin 的 commit"
        required: true
        default: "02368b6b1689c28ff2ebe6d1f73d9c1893ae4ce7"
      mode:
        description: "sync = 覆盖源码并开 PR; verify = 只比对不修改"
        required: true
        type: choice
        options:
          - verify
          - sync
        default: verify

permissions:
  contents: write
  pull-requests: write

env:
  VENDOR_DIR: modules/quickjs/src/main/cinterop/quickjs-ng
  UPSTREAM: quickjs-ng/quickjs

jobs:
  sync:
    name: "${{ inputs.mode }} @ ${{ inputs.ref }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 只拉需要的文件, 不 clone 整个上游仓库 (上游带着 test262/fuzz/examples, 几十 MB)。
      # LICENSE 在清单里: vendored 第三方源码应随带上游许可证原件 (已于 2026-08-29 补齐)。
      - name: Resolve upstream ref
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REF="$REQUESTED_REF"
          echo "请求的 ref: $REF"
          SHA=$(git ls-remote "https://github.com/$UPSTREAM.git" "$REF" | awk '{print $1}' | head -n1)
          if [ -z "$SHA" ]; then
            # 不是 tag/分支名, 当作 commit sha 直接用
            SHA="$REF"
            echo "ls-remote 未命中, 按 commit sha 处理: $SHA"
          else
            echo "解析为 commit: $SHA"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Upstream ref did not resolve to a complete commit SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### 上游 ref" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REF\` → \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build file list
        id: list
        run: |
          set -euo pipefail
          # 现有 vendored 文件 + LICENSE (LICENSE 无后缀, find 的通配匹不到, 显式补上)
          {
            find "$VENDOR_DIR" -maxdepth 1 -type f \
              \( -name '*.c' -o -name '*.h' -o -name '*.js' \) -printf '%f\n'
            echo LICENSE
          } | sort -u > /tmp/files.txt
          echo "同步清单 ($(wc -l < /tmp/files.txt) 个文件):"
          cat /tmp/files.txt

      - name: Download every upstream file
        env:
          UPSTREAM_SHA: ${{ steps.resolve.outputs.sha }}
        run: >-
          python3 scripts/quickjs-upstream.py download --files /tmp/files.txt
          --staging /tmp/upstream --vendor "$VENDOR_DIR" --sha "$UPSTREAM_SHA"

      - name: Compare every vendored file
        id: diff
        run: >-
          python3 scripts/quickjs-upstream.py compare --files /tmp/files.txt
          --staging /tmp/upstream --vendor "$VENDOR_DIR"

      - name: Verify verdict
        if: inputs.mode == 'verify'
        run: |
          set -euo pipefail
          if [ "${{ steps.diff.outputs.changed }}" = "0" ]; then
            echo "✅ vendored 副本与上游 ${{ steps.resolve.outputs.sha }} 完全一致, 无人偷改。"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **纯净**: 与上游完全一致。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🔴 **存在差异**: 见上表与作业日志。要么 ref 选错了, 要么有人绕过流程改了源码。" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::vendored 副本与上游 所选 ref 不一致。若非有意升级, 说明有人直接改了 $VENDOR_DIR 下的源码 —— 定制必须走 cinterop/JNI wrapper 层或编译开关; 万不得已改源码须登记该目录 README 的 B 类小节, 见该 README。"
            exit 1
          fi

      - name: Apply upstream files
        if: inputs.mode == 'sync' && steps.diff.outputs.changed == '1'
        run: |
          set -euo pipefail
          while read -r f; do
            test -s "/tmp/upstream/$f"
            cp "/tmp/upstream/$f" "$VENDOR_DIR/$f"
            echo "  [WROTE] $VENDOR_DIR/$f"
          done < /tmp/files.txt
          git status --porcelain "$VENDOR_DIR"

      - name: Create Pull Request
        if: inputs.mode == 'sync' && steps.diff.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "chore/sync-quickjs-ng-${{ inputs.ref }}"
          delete-branch: true
          add-paths: |
            ${{ env.VENDOR_DIR }}/*
          commit-message: "chore(quickjs): 同步 quickjs-ng 至 ${{ inputs.ref }}"
          title: "chore(quickjs): 同步 quickjs-ng 至 `${{ inputs.ref }}`"
          body: |
            由 `Sync quickjs-ng` 工作流自动生成。**合并前必须完成下方人工验证清单。**

            ## 同步坐标

            | 项 | 值 |
            | --- | --- |
            | 上游 | https://github.com/${{ env.UPSTREAM }} |
            | 请求 ref | `${{ inputs.ref }}` |
            | 解析到 commit | `${{ steps.resolve.outputs.sha }}` |

            > ⚠️ 别用 `quickjs.h` 的 `QJS_VERSION_*` 判定版本 —— 上游只在打 tag 时 bump,
            > master 快照会一直自称上一个版本号。以上面的 commit sha 为准。

            ## 逐文件 diff 摘要

            见 `Compare every vendored file` 日志。下载缺失或比较不完整直接失败，不产生一致性结论。

            ## 需人工验证：各端编译（CI 覆盖 iOS，鸿蒙仍需对应 SDK）

            - [ ] **Android / JVM (JNI + CMake)** —
                  `./gradlew :modules:quickjs-android-native:externalNativeBuildAppDebug`
            - [ ] **Desktop / :ui jvm** — `./gradlew :ui:compileKotlinJvm`
            - [ ] **iOS**（需 macOS）— `bash scripts/build-ios-native.sh` 且
                  `./gradlew :data:cinteropQuickjsIosArm64`
            - [ ] **鸿蒙**（需鸿蒙 SDK）— `./gradlew :data:cinteropQuickjsOhosArm64 -PenableOhosTarget=true`
                  （目标名是 ohosArm64, 没有 linuxArm64 这个 target; 同仓库
                   `compileKotlinOhosArm64` / `kspKotlinOhosArm64` 即同一命名法则）

            ## 需人工审查

            - [ ] `data/src/cinterop/quickjs.def` 的 `qjs_*` wrapper 是否被上游 API 签名变更打断
            - [ ] 是否新增 / 删除了 `.c` 文件 —— 若有，需同步修改列 .c 源文件清单的三处：
                  `modules/quickjs-android-native/src/main/cpp/CMakeLists.txt`（quickjs 4 个）、
                  `ohosApp/entry/src/main/cpp/CMakeLists.txt`（quickjs 4 个, mbedtls 走 GLOB）、
                  `scripts/build-ios-native.sh`（quickjs 4 个 + mbedtls 走 ls）。
                  另外两处不列源文件、但同样会随上游头文件/API 变动而失效：
                  `data/src/cinterop/quickjs.def`（headers 与 qjs_* wrapper）、
                  `data/build.gradle.kts` 的 cinterop 块（defFile 与 includeDirs）。
            - [ ] JS 引擎行为回归（书源解析 / bytecode 缓存兼容性）
            - [ ] 更新 `${{ env.VENDOR_DIR }}/README.md` 的「版本」表格 commit sha

      - name: Nothing to do
        if: inputs.mode == 'sync' && steps.diff.outputs.changed == '0'
        run: echo "vendored 副本已与 ${{ steps.resolve.outputs.sha }} 一致, 无需开 PR。"

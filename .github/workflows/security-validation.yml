name: Security regression checks

on:
  # Security-sensitive adapters, build scripts and vendored engines span the whole tree.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Fail-closed upstream verification regression
        run: python3 scripts/security-tests/test_quickjs_upstream.py
      - name: Verify Android provider and pinned Cronet libraries
        env:
          CRONET_TEST_AAR: /tmp/cronet.aar
        run: |
          curl --fail --location --max-time 120 https://dl.google.com/dl/android/maven2/org/chromium/net/cronet-embedded/143.7445.0/cronet-embedded-143.7445.0.aar -o "$CRONET_TEST_AAR"
          echo 'afdd7af7568e9758e3690c3a4a228f30993ac3e4ef0f94c72bb68503c0167697  /tmp/cronet.aar' | sha256sum --check
          ./gradlew -p scripts/security-tests/android run --console=plain
      - name: Build Web and run real browser security tests
        working-directory: modules/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
          pnpm type-check
          pnpm build-only
          cmp dist/index.html ../../ui/src/commonMain/composeResources/files/web/index.html
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile production modules and run archive tests
        run: >-
          ./gradlew :data:compileKotlinJvm :core:compileKotlinJvm :ui:compileKotlinJvm
          :data:jvmTest --tests 'io.legado.app.model.fileBook.*'
          --tests 'io.legado.app.help.compress.StreamDecompressorTest'
          -PenableIosTarget=false --stacktrace --console=plain
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-jvm-test-results
          path: data/build/reports/tests
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: security-konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Build QuickJS and mbedtls for simulator
        run: bash scripts/build-ios-native.sh ios_simulator_arm64
      - name: Compile iOS UI and execute real QuickJS and cookie tests
        run: >-
          ./gradlew :ui:compileKotlinIosSimulatorArm64 :data:iosSimulatorArm64Test
          -PenableIosTarget=true --stacktrace --console=plain
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-ios-test-results
          path: data/build/reports/tests
  ios-app:
    name: iOS app (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [simulator, device]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: security-konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and package the complete unsigned app
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash scripts/security-tests/build-ios-app.sh "$BUILD_TARGET"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-ios-app-${{ matrix.target }}
          path: |
            iosApp/build/security/build.log
            iosApp/build/security/*.zip
            iosApp/build/security/*.ipa
          retention-days: 7
